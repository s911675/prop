server.port=8080

# -----------------------------------------------------------------------
# Primary DataSource (Write DB)
# -----------------------------------------------------------------------
db.primary.jdbc-url=jdbc:h2:file:./propdb;AUTO_SERVER=TRUE
db.primary.driver-class-name=org.h2.Driver
db.primary.username=sa
db.primary.password=

# -----------------------------------------------------------------------
# Replica DataSource (Read DB)
# 운영 전환 시 별도 Replica 호스트로 교체
# -----------------------------------------------------------------------
db.replica.jdbc-url=jdbc:h2:file:./propdb;AUTO_SERVER=TRUE
db.replica.driver-class-name=org.h2.Driver
db.replica.username=sa
db.replica.password=

# -----------------------------------------------------------------------
# DatabasePropertyLoader 전용 (Spring 기동 전 독립 DBCP — Replica 사용)
# JNDI 사용 시: jndi.name=jdbc/propds  (Tomcat: java:comp/env/jdbc/propds)
# -----------------------------------------------------------------------
jdbc.url=jdbc:h2:file:./propdb;AUTO_SERVER=TRUE
jdbc.driver.class.name=org.h2.Driver
jdbc.username=sa
jdbc.password=

# -----------------------------------------------------------------------
# H2 콘솔 (개발 전용)
# -----------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# schema.sql / data.sql 초기화 (항상 실행, 멱등 upsert)
spring.sql.init.mode=always

# -----------------------------------------------------------------------
# MyBatis
# -----------------------------------------------------------------------
mybatis.configuration.map-underscore-to-camel-case=true

# -----------------------------------------------------------------------
# 사이트 구분자
# -----------------------------------------------------------------------
grip.site=myapp

# -----------------------------------------------------------------------
# 파일 기반 프라퍼티 (DB 프라퍼티 없을 때 fallback)
# -----------------------------------------------------------------------
app.title=File-Based Title
app.version=0.0.1
