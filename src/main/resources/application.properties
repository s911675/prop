server.port=8080

# -----------------------------------------------------------------------
# H2 파일 기반 DB (AUTO_SERVER=TRUE: 앱 기동 전 DBCP 연결과 Spring Pool 동시 허용)
# -----------------------------------------------------------------------
spring.datasource.url=jdbc:h2:file:./propdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 콘솔: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./propdb)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# schema.sql / data.sql 초기화 (항상 실행, CREATE TABLE IF NOT EXISTS 사용으로 멱등)
spring.sql.init.mode=always

# -----------------------------------------------------------------------
# MyBatis
# -----------------------------------------------------------------------
mybatis.configuration.map-underscore-to-camel-case=true

# -----------------------------------------------------------------------
# DatabasePropertyLoader 전용 설정
# Spring DataSource Bean 초기화 전에 실행되므로 별도 jdbc.* 프라퍼티 사용
# JNDI 사용 시: jndi.name=java:comp/env/jdbc/myDataSource
# -----------------------------------------------------------------------
jdbc.url=jdbc:h2:file:./propdb;AUTO_SERVER=TRUE
jdbc.driver.class.name=org.h2.Driver
jdbc.username=sa
jdbc.password=

# 사이트 구분자: DB에서 site='myapp' 또는 site='default' 행을 로드
grip.site=myapp

# -----------------------------------------------------------------------
# 데모용 파일 기반 프라퍼티 (DB 프라퍼티가 없을 때 fallback)
# -----------------------------------------------------------------------
app.title=File-Based Title
app.version=0.0.1
