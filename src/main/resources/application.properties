server.port=8080

# -----------------------------------------------------------------------
# Primary DataSource (Write DB)
# -----------------------------------------------------------------------
db.primary.jdbc-url=jdbc:h2:file:./propdb;AUTO_SERVER=TRUE
db.primary.driver-class-name=org.h2.Driver
db.primary.username=sa
db.primary.password=

# -----------------------------------------------------------------------
# Replica DataSource (Read DB)
# Replace with separate replica host for production
# -----------------------------------------------------------------------
db.replica.jdbc-url=jdbc:h2:file:./propdb;AUTO_SERVER=TRUE
db.replica.driver-class-name=org.h2.Driver
db.replica.username=sa
db.replica.password=

# -----------------------------------------------------------------------
# DatabasePropertyLoader (standalone DBCP before Spring startup - Replica)
# JNDI: jndi.name=jdbc/propds  (Tomcat: java:comp/env/jdbc/propds)
# -----------------------------------------------------------------------
jdbc.url=jdbc:h2:file:./propdb;AUTO_SERVER=TRUE
jdbc.driver.class.name=org.h2.Driver
jdbc.username=sa
jdbc.password=

# -----------------------------------------------------------------------
# H2 Console (dev only)
# -----------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# schema.sql / data.sql initialization (always, idempotent upsert)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# HTTP response encoding (Content-Type: application/json;charset=UTF-8)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# -----------------------------------------------------------------------
# MyBatis
# -----------------------------------------------------------------------
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# -----------------------------------------------------------------------
# Valkey / Redis
#
# [DEV]  standalone  - comment out sentinel block, use host/port
# [PROD] sentinel HA - comment out host/port, use sentinel block
# -----------------------------------------------------------------------

# --- Standalone (dev / single-node) ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- Sentinel HA (production) ---
# Sentinel quorum: Sentinel1(WAS1:26379), Sentinel2(WAS2:26379), Sentinel3(DB1:26379)
# spring.data.redis.sentinel.master=mymaster
# spring.data.redis.sentinel.nodes=WAS1_IP:26379,WAS2_IP:26379,DB1_IP:26379
# spring.data.redis.sentinel.password=

# Valkey auth (primary + replicas share the same password)
spring.data.redis.password=
spring.data.redis.timeout=2000ms

# Connection pool (Lettuce)
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=1
spring.data.redis.lettuce.pool.max-wait=1000ms

# -----------------------------------------------------------------------
# Cache feature flags
#   cache.code.enabled=true       : use Redis for common code cache
#   cache.code.enabled=false      : use JVM ConcurrentMap (single-instance)
#   cache.property.pubsub.enabled : broadcast reload event to all instances
# -----------------------------------------------------------------------
cache.code.enabled=true
cache.property.pubsub.enabled=true
cache.code.detail.ttl-minutes=10
cache.code.grp.ttl-minutes=30

# -----------------------------------------------------------------------
# Site identifier
# -----------------------------------------------------------------------
grip.site=myapp

# -----------------------------------------------------------------------
# File-based properties (fallback when DB properties are unavailable)
# -----------------------------------------------------------------------
app.title=File-Based Title
app.version=0.0.1
