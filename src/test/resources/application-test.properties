# Test: use in-memory H2 instead of file DB for isolation
# Disable Redis features — no Redis available in the test environment
db.primary.jdbc-url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
db.primary.driver-class-name=org.h2.Driver
db.primary.username=sa
db.primary.password=

db.replica.jdbc-url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
db.replica.driver-class-name=org.h2.Driver
db.replica.username=sa
db.replica.password=

jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
jdbc.driver.class.name=org.h2.Driver
jdbc.username=sa
jdbc.password=

cache.code.enabled=false
cache.property.pubsub.enabled=false
